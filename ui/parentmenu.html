<script>
(function installParentMenuRenderer_(){
  /* CoreUI Icons dipakai sebagai sistem ikon sidebar. */
  function ensureCoreUIIcons_(){
    if(document.getElementById('satriaCoreUIIcons'))return;
    var link=document.createElement('link');
    link.id='satriaCoreUIIcons';
    link.rel='stylesheet';
    link.href='https://cdn.jsdelivr.net/npm/@coreui/icons/css/all.min.css';
    document.head.appendChild(link);
  }
  ensureCoreUIIcons_();

  function v(m,k){return String(m&&m[k]!=null?m[k]:'').trim();}
  function code(m){return v(m,'kode_menu').toUpperCase();}
  function name(m){return v(m,'nama_menu');}
  function parent(m){return v(m,'parent_id').toUpperCase();}
  function order(m){var n=Number(m&&m.urutan);return Number.isFinite(n)?n:999999;}
  function key(s){return String(s||'').trim().toUpperCase();}

  /* Menu berikut sudah memiliki blok khusus ADMINISTRASI SEKOLAH di sidebar. */
  function isStaticSchoolAdminMenu_(m){
    return /^ADMIN_(SEKOLAH|KEPALA_SEKOLAH|KELAS|GURU|KARYAWAN|SISWA)$/.test(code(m));
  }

  var ICONS={
    HOME:'cil-home', DASHBOARD:'cil-speedometer', MENU:'cil-menu',
    PROGRAM:'cil-puzzle', PRIORITAS:'cil-bullseye',
    SCHOOL:'cil-school', SEKOLAH:'cil-school', SBI:'cil-shield-alt', INTEGRITAS:'cil-shield-alt',
    MANTAP:'cil-star', LITERASI:'cil-book', NUMERASI:'cil-calculator', SMSS:'cil-chart-line',
    TEACHER:'cil-education', GURU:'cil-education', MENGAJAR:'cil-book', AGENDA:'cil-calendar',
    KARYAWAN:'cil-people', WORK:'cil-briefcase', KERJA:'cil-briefcase', MONITORING:'cil-list',
    STUDENT:'cil-user', SISWA:'cil-user', MURID:'cil-user', PRESENSI:'cil-check-circle', ABSEN:'cil-check-circle',
    KELAS:'cil-layers', KEPALA:'cil-user', KEPALA_SEKOLAH:'cil-user',
    DATA:'cil-data-transfer', DATABASE:'cil-storage', LAPORAN:'cil-notes', CETAK:'cil-print', PDF:'cil-file',
    SETTINGS:'cil-settings', SETTING:'cil-settings', PENGATURAN:'cil-settings',
    USER:'cil-user', USERS:'cil-people', ROLE:'cil-lock-locked', PERMISSION:'cil-key',
    UPLOAD:'cil-cloud-upload', DOWNLOAD:'cil-cloud-download', REFRESH:'cil-reload', SEARCH:'cil-search',
    CALENDAR:'cil-calendar', CLOCK:'cil-clock', PHOTO:'cil-image', FILE:'cil-file', FOLDER:'cil-folder',
    HOMEWORK:'cil-notes', TARGET:'cil-bullseye', REPORT:'cil-chart-line',
    DEFAULT:'cil-puzzle'
  };

  function iconClass(m){
    var raw=v(m,'icon');
    if(!raw)return ICONS.DEFAULT;
    var normalized=key(raw);
    if(ICONS[normalized])return ICONS[normalized];
    if(/^cil-[a-z0-9-]+$/i.test(raw))return raw;
    return ICONS.DEFAULT;
  }

  function iconHtml(m){
    return '<i class="nav-icon '+escapeHtml(iconClass(m))+'" aria-hidden="true"></i>';
  }

  window.renderMenus=function(menus){
    var box=document.getElementById('dynamicMenus');
    if(!box)return;
    box.innerHTML='';

    var source=(Array.isArray(menus)?menus:[]).filter(function(m){
      return code(m)!=='DASHBOARD' && String(m.aktif).toUpperCase()!=='FALSE' && !isStaticSchoolAdminMenu_(m);
    });

    var byCode={},byName={},groups={};
    source.forEach(function(m){
      byCode[code(m)]=m;
      byName[key(name(m))]=m;
    });

    source.forEach(function(m){
      var p=parent(m);
      if(p){
        if(!groups[p])groups[p]=[];
        groups[p].push(m);
      }
    });
    Object.keys(groups).forEach(function(p){
      groups[p].sort(function(a,b){return order(a)-order(b);});
    });

    var rendered={};

    function makeLeaf(m,isChild){
      var c=code(m),b=document.createElement('button');
      b.type='button';
      b.className='nav-item'+(isChild?' nav-child':'');
      b.dataset.menu=c;
      b.innerHTML=iconHtml(m)+'<span class="nav-label">'+escapeHtml(name(m)||c)+'</span>';
      b.onclick=function(){selectMenu(c);};
      rendered[c]=true;
      var w=document.createElement('div');
      w.className='nav-leaf';
      w.appendChild(b);
      return w;
    }

    function makeGroup(label,children,parentMenu){
      var w=document.createElement('div');
      w.className='nav-group';
      w.dataset.parent=key(label);
      var b=document.createElement('button');
      b.type='button';
      b.className='nav-item nav-parent';
      b.innerHTML=(parentMenu?iconHtml(parentMenu):'<i class="nav-icon cil-puzzle" aria-hidden="true"></i>')+
        '<span class="nav-label">'+escapeHtml(label)+'</span><span class="nav-chevron">▾</span>';
      b.setAttribute('aria-expanded','false');
      var ch=document.createElement('div');
      ch.className='nav-children';
      children.slice().sort(function(a,b){return order(a)-order(b);}).forEach(function(m){
        ch.appendChild(makeLeaf(m,true));
      });
      b.onclick=function(e){
        e.preventDefault();
        var open=w.classList.toggle('open');
        b.setAttribute('aria-expanded',open?'true':'false');
      };
      w.appendChild(b);
      w.appendChild(ch);
      return w;
    }

    var roots=source.filter(function(m){return !parent(m);})
      .sort(function(a,b){return order(a)-order(b);});

    roots.forEach(function(m){
      var c=code(m);
      var children=groups[c]||[];
      var childrenByName=groups[key(name(m))]||[];
      if(children.length || childrenByName.length){
        var all=children.length?children:childrenByName;
        box.appendChild(makeGroup(name(m)||c,all,m));
        rendered[c]=true;
      }else{
        box.appendChild(makeLeaf(m,false));
      }
    });

    Object.keys(groups).sort(function(a,b){
      return order(groups[a][0])-order(groups[b][0]);
    }).forEach(function(p){
      var parentMenu=byCode[p]||byName[p]||null;
      var label=parentMenu?name(parentMenu):p;
      var children=groups[p].filter(function(m){return !rendered[code(m)];});
      if(!children.length)return;
      box.appendChild(makeGroup(label,children,parentMenu));
    });

    source.filter(function(m){return !rendered[code(m)];})
      .sort(function(a,b){return order(a)-order(b);})
      .forEach(function(m){box.appendChild(makeLeaf(m,true));});

    if(!document.getElementById('satriaParentMenuStyle')){
      var s=document.createElement('style');
      s.id='satriaParentMenuStyle';
      s.textContent=
        '.nav-group{margin:0}'+
        '.nav-item{display:flex;align-items:center;gap:.65rem;text-align:left}'+
        '.nav-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'+
        '.nav-icon{width:1.15rem;min-width:1.15rem;text-align:center;font-size:1rem;line-height:1;display:inline-block}'+
        '.nav-parent{width:100%;font-weight:600;font-size:.90em!important;line-height:1.25;min-height:42px!important}'+
        '.nav-parent .nav-chevron{margin-left:auto;font-size:11px;transition:transform .18s ease}'+
        '.nav-group.open>.nav-parent .nav-chevron{transform:rotate(180deg)}'+
        '.nav-children{display:none;margin:2px 0 6px 13px;padding-left:9px;border-left:1px solid rgba(46,125,50,.22)}'+
        '.nav-group.open>.nav-children{display:block}'+
        '.nav-child{font-size:.92em!important;min-height:38px!important;padding-left:13px!important}'+
        '.nav-leaf{margin:0}'+
        '.nav-child:hover,.nav-parent:hover{filter:brightness(.98)}';
      document.head.appendChild(s);
    }
  };
})();
</script>
