<script>
function routeAdminSchoolMenu_(menuCode){
  var code=String(menuCode||'').toUpperCase();
  if(!code)return;
  if(typeof selectMenu==='function'){
    if(code==='ADMIN_KEPALA_SEKOLAH' && typeof loadAdminKepalaSekolah==='function'){
      return loadAdminKepalaSekolah();
    }
    if(code==='ADMIN_SISWA' && typeof loadAdminSiswa==='function'){
      return loadAdminSiswa();
    }
    return selectMenu(code);
  }
}
</script>
