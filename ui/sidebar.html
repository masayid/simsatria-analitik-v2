<script>
function routeAdminSchoolMenu_(menuCode){
  var code=String(menuCode||'').toUpperCase();
  if(!code)return;
  if(typeof selectMenu==='function'){
    if(code==='ADMIN_KEPALA_SEKOLAH'&&typeof loadAdminKepalaSekolah==='function')return loadAdminKepalaSekolah();
    if(code==='ADMIN_SISWA'&&typeof loadAdminSiswa==='function')return loadAdminSiswa();
    return selectMenu(code);
  }
}
(function installKaryawanMenuGuard_(){
  var installed=false;
  function normalize(s){return String(s||'').trim().toUpperCase();}
  function ensureChildren(){
    if(installed)return;
    var box=document.getElementById('dynamicMenus');
    if(!box)return;
    var group=Array.prototype.slice.call(box.querySelectorAll('.nav-group')).find(function(g){
      var p=g.querySelector('.nav-parent .nav-label');
      return p&&normalize(p.textContent)==='SATRIA KARYAWAN';
    });
    if(!group)return;
    var children=group.querySelector('.nav-children');
    if(!children)return;
    var required=[
      ['MONITORING_KERJA','Monitoring Kerja','cil-briefcase'],
      ['MONITORING_KEBERSIHAN','Monitoring Kebersihan','cil-list'],
      ['MONITORING_KEAMANAN','Monitoring Keamanan','cil-shield-alt'],
      ['MONITORING_PARKIR','Monitoring Parkir','cil-car-alt']
    ];
    required.forEach(function(item){
      if(children.querySelector('[data-menu="'+item[0]+'"]'))return;
      var w=document.createElement('div');w.className='nav-leaf';
      var b=document.createElement('button');b.type='button';b.className='nav-item nav-child';b.dataset.menu=item[0];
      b.innerHTML='<i class="nav-icon '+item[2]+'" aria-hidden="true"></i><span class="nav-label">'+item[1]+'</span>';
      b.onclick=function(){if(typeof selectMenu==='function')selectMenu(item[0]);};
      w.appendChild(b);children.appendChild(w);
    });
    installed=true;
  }
  var timer=setInterval(function(){ensureChildren();if(installed)clearInterval(timer);},200);
  document.addEventListener('DOMContentLoaded',ensureChildren);
})();
</script>
