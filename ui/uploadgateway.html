<script>
/* TAHAP 8.11 — TEST UPLOAD GATEWAY */
function testGatewayUpload() {
  const btn = document.getElementById('testUploadGatewayBtn');
  const result = document.getElementById('gatewayTestResult');
  if (!btn || !result) return;

  const span = btn.querySelector('span');
  let finished = false;

  btn.disabled = true;
  btn.style.opacity = '0.65';
  if (span) span.textContent = 'Menguji Upload...';

  result.style.display = 'block';
  result.innerHTML =
    '<div class="card-body">' +
      '<h5>TEST UPLOAD GATEWAY</h5>' +
      '<p>Membuat file diagnostik dan mengirimkannya melalui Write Gateway...</p>' +
    '</div>';

  const resetButton = function() {
    btn.disabled = false;
    btn.style.opacity = '1';
    if (span) span.textContent = 'TEST UPLOAD GATEWAY';
  };

  const timeoutId = setTimeout(function() {
    if (finished) return;
    finished = true;
    resetButton();
    result.innerHTML =
      '<div class="card-body">' +
        '<h5>TEST UPLOAD GATEWAY — TIMEOUT</h5>' +
        '<p>❌ Server belum mengembalikan respons.</p>' +
        '<p>Pastikan <b>SetupGatewayUploadTest.js</b> sudah dipull dan Web App sudah dideploy ulang.</p>' +
      '</div>';
  }, 30000);

  google.script.run
    .withSuccessHandler(function(response) {
      if (finished) return;
      finished = true;
      clearTimeout(timeoutId);
      resetButton();

      if (!response || response.ok !== true) {
        result.innerHTML =
          '<div class="card-body">' +
            '<h5>TEST UPLOAD GATEWAY — GAGAL</h5>' +
            '<p>❌ Pengujian upload gagal.</p>' +
            '<pre>' + escapeHtml(JSON.stringify(response || {}, null, 2)) + '</pre>' +
          '</div>';
        return;
      }

      result.innerHTML =
        '<div class="card-body">' +
          '<h5>TEST UPLOAD GATEWAY — PASS</h5>' +
          '<p><b>User:</b> ' + escapeHtml(response.user) + '</p>' +
          '<p><b>Role:</b> ' + escapeHtml(response.role) + '</p>' +
          '<p><b>Sekolah:</b> ' + escapeHtml(response.school) + '</p>' +
          '<p><b>Gateway:</b> ' + escapeHtml(response.gateway) + ' ✓</p>' +
          '<p><b>Drive Upload:</b> ' + escapeHtml(response.driveUpload) + ' ✓</p>' +
          '<p><b>File:</b> ' + escapeHtml(response.fileName || '-') + '</p>' +
          '<p><b>Folder School:</b> ' + escapeHtml(response.folderSchool || '-') + '</p>' +
          (response.fileId ? '<p><b>File ID:</b> ' + escapeHtml(response.fileId) + '</p>' : '') +
          '<p>' + escapeHtml(response.message || 'Upload berhasil melalui Write Gateway.') + '</p>' +
        '</div>';
    })
    .withFailureHandler(function(error) {
      if (finished) return;
      finished = true;
      clearTimeout(timeoutId);
      resetButton();
      const message = error && error.message ? error.message : String(error || 'Pengujian upload gagal.');
      result.innerHTML =
        '<div class="card-body">' +
          '<h5>TEST UPLOAD GATEWAY — GAGAL</h5>' +
          '<p>❌ ' + escapeHtml(message) + '</p>' +
        '</div>';
    })
    .testGatewayUploadAsCurrentUser();
}
</script>
