ck;color:#71847b;font-size:12px;margin-top:3px}.admin-guru-table th,.admin-guru-table td{white-space:nowrap}.admin-guru-pagination{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 4px}.admin-guru-pagination span{color:#587067;font-size:13px}.admin-guru-pagination button:disabled{opacity:.45}.admin-guru-modal{width:min(760px,100%)}@media(max-width:700px){.admin-guru-info{align-items:stretch;flex-direction:column}.admin-guru-info .admin-kelas-actions{justify-content:flex-start}.admin-guru-info .admin-school-btn{flex:1}.admin-guru-toolbar .admin-school-actions{width:100%}.admin-guru-toolbar input{width:100%!important}.admin-guru-table{font-size:12px}}';document.head.appendChild(style);}return panel;}
function loadAdminGuru(){const panel=ensureAdminGuruPanel_();if(!panel)return;['adminSekolahPanel','adminKelasPanel'].forEach(function(id){const el=document.getElementById(id);if(el)el.style.display='none';});panel.style.display='block';const master=document.getElementById('masterAdminPanel');if(master)master.style.display='none';const search=document.getElementById('adminGuruSearch');if(search)search.oninput=filterAdminGuru_;const school=SATRIA_SESSION&&SATRIA_SESSION.school||{},name=document.getElementById('adminGuruSchoolName'),meta=document.getElementById('adminGuruSchoolMeta');if(name)name.textContent=school.namaSekolah||'Guru Sekolah';if(meta)meta.textContent='NPSN: '+(school.npsn||'-')+' • ID: '+(school.idSekolah||'-')+' • Sheet: GURU';const body=document.getElementById('adminGuruBody');if(body)body.innerHTML='<tr><td colspan="8" style="padding:25px;text-align:center">Memuat data GURU...</td></tr>';google.script.run.withSuccessHandler(function(res){if(!res||!res.ok)return showAdminGuruNotice_(res&&res.message||'Gagal memuat GURU.','error');ADMIN_GURU_STATE.rows=(res.data&&res.data.rows)||[];ADMIN_GURU_STATE.page=1;renderAdminGuru_();}).withFailureHandler(function(err){showAdminGuruNotice_(err.message,'error');}).getAdminSchoolGuru();}

function renderAdminGuru_(){const rows=getFilteredAdminGuru_(),total=rows.length,totalPages=Math.max(1,Math.ceil(total/ADMIN_GURU_STATE.perPage));ADMIN_GURU_STATE.page=Math.min(Math.max(1,ADMIN_GURU_STATE.page),totalPages);const start=(ADMIN_GURU_STATE.page-1)*ADMIN_GURU_STATE.perPage,pageRows=rows.slice(start,start+ADMIN_GURU_STATE.perPage),body=document.getElementById('adminGuruBody');const count=document.getElementById('adminGuruCount');if(count)count.textContent=total+' Guru'+(ADMIN_GURU_STATE.query&&ADMIN_GURU_STATE.query.length>=3?' ditemukan':'');if(body)body.innerHTML=pageRows.map(function(r){return '<tr><td><strong>'+escapeHtml(r.ID_GURU)+'</strong></td><td>'+escapeHtml(r.NIP||'—')+'</td><td>'+escapeHtml(r.NAMA)+'</td><td>'+escapeHtml(r.MAPEL)+'</td><td class="admin-user-status '+(String(r.STATUS).toUpperCase()==='ACTIVE'?'active':'inactive')+'">'+escapeHtml(r.STATUS)+'</td><td>'+escapeHtml(r.SERTIFIKASI||'—')+'</td><td>'+escapeHtml(r.IJAZAH||'—')+'</td><td><button class="admin-row-btn" onclick="openAdminGuruForm_('+Number(r._row)+')">Edit</button><button class="admin-row-btn danger" onclick="deleteAdminGuru_('+Number(r._row)+')">Hapus</button></td></tr>';}).join('')||'<tr><td colspan="8" style="padding:25px;text-align:center;color:#71847b">Belum ada data GURU.</td></tr>';renderAdminGuruPagination_(totalPages,total);}
function renderAdminGuruPagination_(totalPages,total){const box=document.getElementById('adminGuruPagination');if(!box)return;const p=ADMIN_GURU_STATE.page;box.innerHTML='<button class="admin-school-btn secondary" '+(p<=1?'disabled':'')+' onclick="changeAdminGuruPage_('+(p-1)+')">‹ Prev</button><span>Halaman <strong>'+p+'</strong> / '+totalPages+' • '+total+' data</span><button class="admin-school-btn secondary" '+(p>=totalPages?'disabled':'')+' onclick="changeAdminGuruPage_('+(p+1)+')">Next ›</button>';}

function openAdminGuruForm_(rowNumber){ADMIN_GURU_STATE.editingRow=rowNumber||null;const row=rowNumber?(ADMIN_GURU_STATE.rows||[]).find(function(x){return Number(x._row)===Number(rowNumber);}):{};document.getElementById('adminGuruFormTitle').textContent=rowNumber?'Edit Guru':'Tambah Guru';document.getElementById('adminGuruId').value=row.ID_GURU||'';document.getElementById('adminGuruNip').value=row.NIP||'';document.getElementById('adminGuruName').value=row.NAMA||'';document.getElementById('adminGuruMapel').value=row.MAPEL||'';document.getElementById('adminGuruStatus').value=row.STATUS||'ACTIVE';document.getElementById('adminGuruSertifikasi').value=row.SERTIFIKASI||'';document.getElementById('adminGuruIjazah').value=row.IJAZAH||'';document.getElementById('adminGuruOverlay').style.display='flex';}

function submitAdminGuruForm_(e){e.preventDefault();const btn=document.getElementById('adminGuruSaveBtn');btn.disabled=true;btn.textContent='Menyimpan...';const payload={_row:ADMIN_GURU_STATE.editingRow||0,ID_GURU:document.getElementById('adminGuruId').value.trim(),NIP:document.getElementById('adminGuruNip').value.trim(),NAMA:document.getElementById('adminGuruName').value.trim(),MAPEL:document.getElementById('adminGuruMapel').value.trim(),STATUS:document.getElementById('adminGuruStatus').value,SERTIFIKASI:document.getElementById('adminGuruSertifikasi').value.trim(),IJAZAH:document.getElementById('adminGuruIjazah').value.trim()};google.script.run.withSuccessHandler(function(res){btn.disabled=false;btn.textContent='Simpan Guru';if(!res||!res.ok)return showAdminGuruNotice_(res&&res.message||'Gagal menyimpan GURU.','error');ADMIN_GURU_STATE.rows=(res.data&&res.data.rows)||[];closeAdminGuruForm_();renderAdminGuru_();showAdminGuruNotice_('Data GURU berhasil disimpan.','success');}).withFailureHandler(function(err){btn.disabled=false;btn.textContent='Simpan Guru';showAdminGuruNotice_(err.message,'error');}).saveAdminSchoolGuru(payload);}

function downloadGuruTemplate_(){const headers=['ID_GURU','NIP','NAMA','MAPEL','STATUS','SERTIFIKASI','IJAZAH'];const csv='\ufeff'+headers.join(',')+'\r\n';const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TEMPLATE_GURU.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showAdminGuruNotice_('Template GURU berhasil diunduh.','success');}
function parseGuruCsv_(text){const rows=[],row=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'){if(quoted&&next==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(cell);cell='';if(row.some(function(v){return String(v).trim()!=='';}))rows.push(row.splice(0,row.length));}else cell+=c;}row.push(cell);if(row.some(function(v){return String(v).trim()!=='';}))rows.push(row);return rows;}
