<script>
let SATRIA_SESSION = null;

function loadSession() {
  showLoading(true);
  google.script.run
    .withSuccessHandler(renderSession)
    .withFailureHandler(showSessionError)
    .getSessionContext();
}

function renderSession(response) {
  showLoading(false);
  if (!response || !response.ok) {
    return showSessionError({
      message: response && response.message
        ? response.message
        : 'Sesi tidak valid.'
    });
  }

  SATRIA_SESSION = response.data;
  const user = SATRIA_SESSION.user;
  const school = SATRIA_SESSION.school;

  document.getElementById('welcomeTitle').textContent =
    'Selamat datang, ' + user.nama;

  document.getElementById('sessionInfo').textContent =
    user.email + ' • ' + user.role;

  document.getElementById('schoolInfo').innerHTML =
    '<strong>' + escapeHtml(school.namaSekolah) + '</strong><br>' +
    'NPSN: ' + escapeHtml(school.npsn) +
    ' • ID: ' + escapeHtml(school.idSekolah);

  document.getElementById('headerUser').textContent =
    user.nama + ' • ' + user.role;

  renderMenus(SATRIA_SESSION.menus || []);
  renderPermissions(SATRIA_SESSION.permissions || []);
}

function renderMenus(menus) {
  const box = document.getElementById('dynamicMenus');
  if (!box) return;

  box.innerHTML = '';

  menus
    .filter(function (m) {
      return String(m.kode_menu).toUpperCase() !== 'DASHBOARD';
    })
    .forEach(function (menu) {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.dataset.menu = menu.kode_menu;
      btn.innerHTML =
        escapeHtml(menu.icon || '•') +
        ' <span>' +
        escapeHtml(menu.nama_menu) +
        '</span>';
      btn.onclick = function () {
        selectMenu(menu.kode_menu);
      };
      box.appendChild(btn);
    });
}

function renderPermissions(permissions) {
  const box = document.getElementById('permissionGrid');
  if (!box) return;

  const labels = [
    ['READ', 'Baca'],
    ['INPUT', 'Input/Simpan'],
    ['UPLOAD', 'Upload'],
    ['PDF', 'PDF'],
    ['ADMIN', 'Administrasi']
  ];

  const allowed = new Set(
    permissions.map(function (p) {
      return String(p).toUpperCase();
    })
  );

  box.innerHTML = labels.map(function (item) {
    const code = item[0];
    const label = item[1];
    const isAllowed = allowed.has(code);

    return '<div class="permission-card ' +
      (isAllowed ? 'allowed' : 'blocked') +">' +
      '<b>' + code + '</b>' +
      '<span>' + label + '</span>' +
      '<strong>' + (isAllowed ? '✓' : '—') + '</strong>' +
      '</div>';
  }).join('');
}

function selectMenu(menuCode) {
  document.querySelectorAll('.nav-item').forEach(function (el) {
    el.classList.toggle(
      'active',
      el.dataset.menu === menuCode
    );
  });

  if (menuCode === 'DASHBOARD') {
    return loadDashboard();
  }

  document.getElementById('content').innerHTML =
    '<section class="card"><div class="card-body">' +
    '<div class="eyebrow">MENU</div>' +
    '<h3>' + escapeHtml(menuCode) + '</h3>' +
    '<p>Modul siap dihubungkan pada tahap migrasi menu SIM SATRIA.</p>' +
    '</div></section>';
}

function loadDashboard() {
  window.location.hash = 'dashboard';
}

function showSessionError(error) {
  showLoading(false);

  const message = error && error.message
    ? error.message
    : String(error || 'Gagal memuat sesi.');

  const title = document.getElementById('welcomeTitle');
  const info = document.getElementById('sessionInfo');

  if (title) title.textContent = 'Akses belum tersedia';
  if (info) info.textContent = message;
}

function showLoading(show) {
  const el = document.getElementById('loading');
  if (el) el.style.display = show ? 'block' : 'none';
}

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

window.addEventListener('load', loadSession);
</script>
