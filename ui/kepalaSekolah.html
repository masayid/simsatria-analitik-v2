<section id="adminKepalaSekolahPanel" class="admin-school-panel" style="display:none;">
  <div class="admin-school-hero">
    <div><div class="eyebrow">SIM SATRIA • ADMINISTRASI SEKOLAH</div><h2>Kepala Sekolah</h2><p id="ksSchoolMeta">Master Kepala Sekolah sekolah aktif.</p></div>
    <div class="admin-school-badge">KEPALA SEKOLAH</div>
  </div>
  <div class="ks-card">
    <div class="ks-toolbar"><div><strong>Data Kepala Sekolah</strong><small>Digunakan bersama oleh modul laporan dan PDF SIM SATRIA.</small></div><div class="ks-actions"><button class="admin-school-btn secondary" onclick="refreshKepalaSekolah()">↻ Refresh</button><button class="admin-school-btn primary" onclick="openKepalaSekolahForm_()">＋ Input / Edit</button></div></div>
    <div id="ksNotice" class="admin-school-notice" style="display:none"></div>
    <div id="ksDataCard" class="ks-data-card"></div>
  </div>
</section>

<div id="ksModal" class="admin-user-overlay" style="display:none;">
  <div class="admin-user-modal ks-modal">
    <div class="admin-user-head"><div><div class="eyebrow">MASTER KEPALA SEKOLAH</div><h3 id="ksFormTitle">Input Kepala Sekolah</h3></div><button class="admin-user-close" onclick="closeKepalaSekolahForm_()">×</button></div>
    <form onsubmit="submitKepalaSekolahForm_(event)">
      <div class="admin-user-grid">
        <label><span>ID_KS</span><input id="ksId" required></label>
        <label><span>NAMA</span><input id="ksNama" required></label>
        <label><span>NIP</span><input id="ksNip"></label>
        <label><span>NUPTK</span><input id="ksNuptk"></label>
        <label><span>PANGKAT</span><input id="ksPangkat"></label>
        <label><span>GOLONGAN</span><input id="ksGolongan"></label>
        <div class="ks-sign-card"><div class="ks-sign-title">Tanda Tangan Bentuk-1</div><img id="ksPreview1" class="ks-sign-preview" alt="Preview tanda tangan bentuk 1"><input id="ksFile1" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="previewKSSignature_(event,1)"><button type="button" class="admin-school-btn secondary" onclick="document.getElementById('ksFile1').click()">Upload Gambar</button><small>Maksimal 1 MB.</small></div>
        <div class="ks-sign-card"><div class="ks-sign-title">Tanda Tangan Bentuk-2</div><img id="ksPreview2" class="ks-sign-preview" alt="Preview tanda tangan bentuk 2"><input id="ksFile2" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="previewKSSignature_(event,2)"><button type="button" class="admin-school-btn secondary" onclick="document.getElementById('ksFile2').click()">Upload Gambar</button><small>Maksimal 1 MB.</small></div>
      </div>
      <div class="admin-user-foot"><button type="button" class="admin-school-btn secondary" onclick="closeKepalaSekolahForm_()">Batal</button><button id="ksSaveBtn" type="submit" class="admin-school-btn primary">Simpan</button></div>
    </form>
  </div>
</div>

<style>
.ks-card{background:#fff;border:1px solid #dfebe5;border-radius:16px;padding:14px}.ks-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.ks-toolbar small{display:block;color:#71847b;font-size:11px;margin-top:3px}.ks-actions{display:flex;gap:7px}.ks-data-card{margin-top:12px}.ks-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.ks-item{border:1px solid #e1ebe6;border-radius:12px;padding:12px;background:#f9fcfa}.ks-item small{display:block;color:#75867e;font-size:11px}.ks-item strong{display:block;color:#173c2e;margin-top:4px}.ks-signs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ks-sign-view{border:1px solid #e1ebe6;border-radius:12px;padding:10px;background:#fff}.ks-sign-view img{width:100%;height:90px;object-fit:contain;background:#f4f7f5;border-radius:8px}.ks-empty{padding:30px;text-align:center;color:#71847b}.ks-modal{width:min(850px,100%)}.ks-sign-card{border:1px solid #dfeae4;border-radius:12px;padding:12px;background:#f9fcfa}.ks-sign-title{font-size:12px;font-weight:800;color:#355247;margin-bottom:8px}.ks-sign-preview{display:block;width:100%;height:110px;object-fit:contain;background:#fff;border:1px dashed #bfcfc6;border-radius:8px;margin-bottom:8px}.ks-sign-card small{display:block;color:#71847b;font-size:10px;margin-top:4px}@media(max-width:750px){.ks-grid{grid-template-columns:1fr 1fr}.ks-signs{grid-template-columns:1fr}.ks-toolbar{flex-direction:column;align-items:stretch}.ks-actions{justify-content:flex-start}}@media(max-width:520px){.ks-grid{grid-template-columns:1fr}.ks-modal{width:100%}}
</style>
