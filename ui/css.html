<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#f5f7f2;color:#18352a}
body{overflow-x:hidden}
.header{padding:16px 22px;background:linear-gradient(135deg,#0b3d2e,#2e7d32);color:#fff}
.header span{margin-left:10px;opacity:.8}
.layout{display:flex;min-height:calc(100vh - 60px);width:100%;min-width:0}
aside{width:210px;flex:0 0 210px;background:#fff;padding:18px;min-height:calc(100vh - 60px)}
aside button{display:block;width:100%;margin-bottom:8px;padding:10px;border:0;border-radius:8px;background:#eef7f0;text-align:left}
main{flex:1;min-width:0;width:0;padding:24px;overflow-x:hidden}
#content .agenda-page-shell{width:100%;max-width:1500px;margin:0 auto;padding:4px 0 40px}
#content .agenda-card{background:#fff;border:1px solid #e3ebe6;border-radius:18px;box-shadow:0 8px 28px rgba(11,61,46,.08);overflow:hidden}
#content .agenda-card-body{padding:24px}
#content .agenda-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}
#content .agenda-eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#238653;margin-bottom:4px}
#content .agenda-title{margin:0;font-size:28px;line-height:1.2;font-weight:800;color:#173c2e}
#content .agenda-subtitle{margin:5px 0 0;color:#6b7b73;font-size:14px}
#content .agenda-btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.18s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#content .agenda-btn-primary{background:linear-gradient(135deg,#0b6b45,#238653);color:#fff;box-shadow:0 5px 14px rgba(35,134,83,.2)}
#content .agenda-btn-outline{background:#fff;color:#176c47;border:1px solid #b9d8c8}
#content .agenda-filter{background:#f6faf7;border:1px solid #e1eee7;border-radius:14px;padding:15px;margin-bottom:18px}
#content .agenda-filter-grid{display:grid;grid-template-columns:minmax(180px,260px) minmax(180px,260px) 1fr;gap:12px;align-items:end}
#content .agenda-field label{display:block;font-size:12px;font-weight:800;color:#36584a;margin-bottom:5px}
#content .agenda-field input,#content .agenda-field select,#content .agenda-field textarea{width:100%;box-sizing:border-box;border:1px solid #d4e0da;border-radius:9px;background:#fff;padding:10px 12px;font:inherit;color:#20382e;outline:none}
#content .agenda-filter-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
#content #agendaStatus{min-height:0}
#content #agendaTableWrap{width:100%;max-width:100%;overflow:hidden;border-radius:12px}
#content #agendaTableWrap .table-responsive{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:12px}
#content #agendaTableWrap table{width:100%;min-width:1100px;border-collapse:collapse;background:#fff;font-size:13px}
#content #agendaTableWrap th{background:#eaf6ef;color:#174b35;font-weight:800;white-space:nowrap;padding:10px 9px;border-bottom:1px solid #cfe3d8;text-align:left}
#content #agendaTableWrap td{padding:9px;border-bottom:1px solid #edf1ee;color:#294138;vertical-align:top;max-width:280px;word-break:break-word}
#content #agendaTableWrap tbody tr:hover{background:#f8fcfa}
#content > .container-fluid.px-0{width:100%;max-width:1500px;margin:0 auto;padding:0!important}
#content > .container-fluid.px-0 > .card{border:1px solid #e3ebe6!important;border-radius:18px!important;box-shadow:0 8px 28px rgba(11,61,46,.08)!important;background:#fff!important;overflow:hidden}
#content > .container-fluid.px-0 > .card > .card-body{padding:24px!important}
#content > .container-fluid.px-0 .text-uppercase.small.fw-semibold.text-success{font-size:12px!important;letter-spacing:.12em;color:#238653!important}
#content > .container-fluid.px-0 h3.h4{margin:0;font-size:28px;line-height:1.2;font-weight:800;color:#173c2e}
#content > .container-fluid.px-0 .text-secondary{color:#6b7b73!important}
#content > .container-fluid.px-0 .btn-success{background:linear-gradient(135deg,#0b6b45,#238653)!important;border-color:#0b6b45!important;color:#fff!important;border-radius:10px!important;font-weight:700!important;padding:10px 16px!important}
#content > .container-fluid.px-0 .btn-outline-success{color:#176c47!important;border-color:#b9d8c8!important;background:#fff!important;border-radius:10px!important;font-weight:700!important}
#content > .container-fluid.px-0 > .card > .card-body > .card.bg-body-tertiary{background:#f6faf7!important;border:1px solid #e1eee7!important;border-radius:14px!important}
#content > .container-fluid.px-0 .form-control{border:1px solid #d4e0da;border-radius:9px;padding:10px 12px;color:#20382e}
#content > .container-fluid.px-0 #agendaTableWrap{overflow:hidden}
#content > .container-fluid.px-0 #agendaTableWrap .table-responsive{overflow-x:auto!important;width:100%!important;max-width:100%!important}
#content > .container-fluid.px-0 #agendaTableWrap table{min-width:1100px;width:100%}
#agendaModal{position:fixed!important;inset:0!important;z-index:10000!important;display:none!important;background:rgba(8,30,21,.56);padding:12px;box-sizing:border-box;align-items:center;justify-content:center}
#agendaModal.show,#agendaModal.agenda-modal-open{display:flex!important}
#agendaModal .modal-dialog{width:min(1120px,100%);height:min(94vh,900px);max-width:none!important;margin:0!important;display:flex;min-height:0;align-items:stretch}
#agendaModal .modal-content{width:100%;height:100%;min-height:0;background:#fff;border:0;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
#agendaModal .modal-header{flex:0 0 auto;padding:18px 22px;border-bottom:1px solid #e4ebe7;display:flex;align-items:center;justify-content:space-between;gap:15px;background:#fff}
#agendaModal .modal-header .text-success{color:#238653!important}
#agendaModal .modal-title{margin:3px 0 0;font-size:23px;font-weight:800;color:#173c2e}
#agendaModal .modal-header .btn-close{width:38px;height:38px;margin:0;padding:0;background:#f2f5f3;border:0;border-radius:50%;opacity:1;display:flex;align-items:center;justify-content:center;background-image:none!important;font-size:0}
#agendaModal .modal-header .btn-close::before{content:'×';font-size:29px;line-height:1;color:#60736a;font-weight:400}
#agendaModal form{display:flex;flex:1;min-height:0;flex-direction:column}
#agendaModal .modal-body{display:block;flex:1 1 auto!important;min-height:0!important;height:auto!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch;padding:22px;background:#fbfdfc;scrollbar-width:thin;scrollbar-color:#8fbba3 #edf3ef}
#agendaModal .modal-body::-webkit-scrollbar{width:10px}
#agendaModal .modal-body::-webkit-scrollbar-track{background:#edf3ef;border-radius:10px}
#agendaModal .modal-body::-webkit-scrollbar-thumb{background:#8fbba3;border-radius:10px;border:2px solid #edf3ef}
#agendaModal .modal-footer{flex:0 0 auto;padding:14px 22px;border-top:1px solid #e4ebe7;background:#fff;display:flex;justify-content:flex-end;gap:8px}
#agendaModal .modal-footer button{border-radius:9px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}
#agendaModal .modal-body .row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin:0}
#agendaModal .modal-body .row > [class*="col-12"]{grid-column:span 12;padding:0;min-width:0}
#agendaModal .modal-body .row > .col-md-4{grid-column:span 4}
#agendaModal .modal-body .row > .col-md-6{grid-column:span 6}
#agendaModal .modal-body .row > .col-md-8{grid-column:span 8}
#agendaModal .modal-body .row-cols-2,#agendaModal .modal-body .row-cols-md-4,#agendaModal .modal-body .row-cols-md-5,#agendaModal .modal-body .row-cols-md-3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
#agendaModal .modal-body .row-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
#agendaModal .modal-body .row-cols-md-5{grid-template-columns:repeat(5,minmax(0,1fr))}
#agendaModal .modal-body .row-cols-md-3{grid-template-columns:repeat(3,minmax(0,1fr))}
#agendaModal .form-check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #dbe6e0;border-radius:9px;background:#fff;min-height:40px;margin:0;min-width:0;box-sizing:border-box}
#agendaModal .form-check:hover{border-color:#9dcab2;background:#f8fcfa}
#agendaModal .form-check-input{width:16px!important;height:16px!important;flex:0 0 16px;margin:0!important;accent-color:#238653;position:static!important;float:none!important}
#agendaModal .form-check-label{font-size:13px;line-height:1.25;color:#29473b;cursor:pointer;min-width:0}
#agendaModal .form-control,#agendaModal .form-select,#agendaModal textarea{width:100%;box-sizing:border-box}
#agendaModal .bg-body-secondary{background:#eef3f0!important;color:#64736c!important}
#agendaModal .form-text{font-size:11px;color:#75857d;margin-top:4px}
#agendaModal textarea{resize:vertical;min-height:82px}
body.agenda-modal-body-open{overflow:hidden!important}
@media(max-width:900px){
 main{padding:18px}
 #content > .container-fluid.px-0 > .card > .card-body{padding:18px!important}
 #content > .container-fluid.px-0 > .card > .card-body > .d-flex{align-items:flex-start!important;flex-direction:column!important}
 #content > .container-fluid.px-0 h3.h4{font-size:24px}
 #agendaModal{padding:0}
 #agendaModal .modal-dialog{width:100%;height:100%;max-height:none}
 #agendaModal .modal-content{border-radius:0}
 #agendaModal .modal-header{padding:14px 16px}
 #agendaModal .modal-body{padding:16px}
 #agendaModal .modal-footer{padding:12px 16px}
 #agendaModal .modal-body .row > .col-md-4,#agendaModal .modal-body .row > .col-md-6,#agendaModal .modal-body .row > .col-md-8{grid-column:span 12}
 #agendaModal .modal-body .row-cols-md-5,#agendaModal .modal-body .row-cols-md-4,#agendaModal .modal-body .row-cols-md-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
 aside{width:155px;flex-basis:155px;padding:10px}
 main{padding:12px}
 #content > .container-fluid.px-0 > .card > .card-body{padding:14px!important}
 #content > .container-fluid.px-0 h3.h4{font-size:22px}
 #content > .container-fluid.px-0 > .card > .card-body > .card.bg-body-tertiary .row{display:grid;grid-template-columns:1fr!important;gap:8px}
 #content > .container-fluid.px-0 > .card > .card-body > .card.bg-body-tertiary .ms-md-auto{margin-left:0!important;width:100%;display:grid!important;grid-template-columns:1fr 1fr;gap:7px!important}
 #content > .container-fluid.px-0 > .card > .card-body > .card.bg-body-tertiary .btn{width:100%}
 #agendaModal .modal-header{padding:13px 14px}
 #agendaModal .modal-title{font-size:19px}
 #agendaModal .modal-body{padding:13px}
 #agendaModal .modal-body .row-cols-2,#agendaModal .modal-body .row-cols-md-5,#agendaModal .modal-body .row-cols-md-4,#agendaModal .modal-body .row-cols-md-3{grid-template-columns:1fr}
 #agendaModal .modal-footer{padding:11px 13px}
 #agendaModal .modal-footer button{flex:1}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0T0lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
/* Agenda modal tetap berfungsi walaupun Bootstrap JS belum termuat dari CDN. */
(function(){
  var installed=false;
  function install(){
    if(installed || typeof window.openAgendaModal!=='function') return;
    installed=true;
    var originalOpen=window.openAgendaModal;
    var originalClose=window.closeAgendaModal;
    window.openAgendaModal=function(row){
      try{ originalOpen(row); }catch(e){}
      var modal=document.getElementById('agendaModal');
      if(!modal) return;
      modal.classList.add('agenda-modal-open','show');
      modal.setAttribute('aria-hidden','false');
      document.body.classList.add('agenda-modal-body-open');
      var body=modal.querySelector('.modal-body');
      if(body) body.scrollTop=0;
    };
    window.closeAgendaModal=function(){
      var modal=document.getElementById('agendaModal');
      if(modal){
        modal.classList.remove('agenda-modal-open','show');
        modal.setAttribute('aria-hidden','true');
      }
      document.body.classList.remove('agenda-modal-body-open');
      try{ if(typeof originalClose==='function') originalClose(); }catch(e){}
    };
  }
  var timer=setInterval(function(){
    install();
    if(installed) clearInterval(timer);
  },100);
  document.addEventListener('click',function(e){
    var modal=document.getElementById('agendaModal');
    if(!modal || !modal.classList.contains('agenda-modal-open')) return;
    var close=e.target.closest('[data-bs-dismiss="modal"],.btn-close');
    if(close){e.preventDefault();e.stopPropagation();window.closeAgendaModal();return;}
    if(e.target===modal){e.preventDefault();window.closeAgendaModal();}
  },true);
  document.addEventListener('keydown',function(e){
    var modal=document.getElementById('agendaModal');
    if(modal && modal.classList.contains('agenda-modal-open') && e.key==='Escape'){
      e.preventDefault();window.closeAgendaModal();
    }
  });
})();
</script>
