<style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7f2;color:#18352a}.header{padding:16px 22px;background:linear-gradient(135deg,#0b3d2e,#2e7d32);color:#fff}.header span{margin-left:10px;opacity:.8}.layout{display:flex;min-height:calc(100vh - 60px)}aside{width:210px;background:#fff;padding:18px}aside button{display:block;width:100%;margin-bottom:8px;padding:10px;border:0;border-radius:8px;background:#eef7f0;text-align:left}main{flex:1;padding:24px}
