<script>
(function(){
  let ADMIN_KARYAWAN_STATE={rows:[],page:1,perPage:10,editingRow:null,query:''};
  function isAdmin_(){const u=window.SATRIA_SESSION&&window.SATRIA_SESSION.user||{};return String(u.role||'').toUpperCase()==='ADMIN_SEKOLAH';}
  function hidePanels_(){['adminSekolahPanel','adminKelasPanel','adminGuruPanel','masterAdminPanel'].forEach(function(id){const e=document.getElementById(id);if(e)e.style.display='none';});const w=document.getElementById('welcome'),p=document.getElementById('permissionSection');if(w)w.style.display='none';if(p)p.style.display='none';}
  function ensurePanel_(){
    let panel=document.getElementById('adminKaryawanPanel');if(panel)return panel;const content=document.getElementById('content');if(!content)return null;
    panel=document.createElement('section');panel.id='adminKaryawanPanel';panel.className='admin-school-panel';panel.style.display='none';
    panel.innerHTML='<div class="admin-school-hero"><div><div class="eyebrow">SIM SATRIA • ADMINISTRASI SEKOLAH</div><h2 id="adminKaryawanSchoolName">Karyawan Sekolah</h2><p id="adminKaryawanSchoolMeta">Memuat data KARYAWAN...</p></div><div class="admin-school-badge">DATA KARYAWAN</div></div>'+
      '<div class="admin-karyawan-info"><div><strong>KARYAWAN</strong><span>Directory karyawan sekolah untuk Monitoring Kerja, Kebersihan, Keamanan, Parkir, dan modul lainnya.</span></div><div class="admin-kelas-actions"><button class="admin-school-btn secondary" onclick="refreshAdminKaryawan()">↻ Refresh</button><button class="admin-school-btn secondary" onclick="downloadKaryawanTemplate_()">⇩ Download Template</button><button class="admin-school-btn secondary" onclick="document.getElementById(\'adminKaryawanFileInput\').click()">⇧ Upload Template</button><button class="admin-school-btn primary" onclick="openAdminKaryawanForm_()">＋ Tambah Karyawan</button><input id="adminKaryawanFileInput" type="file" accept=".csv,text/csv" style="display:none" onchange="uploadAdminKaryawanTemplate_(event)"></div></div>'+
      '<div class="admin-school-toolbar admin-karyawan-toolbar"><div><strong id="adminKaryawanCount">0 Karyawan</strong><small>Pencarian aktif setelah minimal 3 karakter.</small></div><div class="admin-school-actions"><input id="adminKaryawanSearch" type="search" minlength="3" placeholder="Cari ID, NIP, nama, bidang tugas..." autocomplete="off"></div></div>'+
      '<div id="adminKaryawanNotice" class="admin-school-notice" style="display:none"></div><div class="admin-school-table-wrap"><table class="admin-school-table admin-karyawan-table"><thead><tr><th>ID_KARYAWAN</th><th>NIP</th><th>NAMA</th><th>BIDANG_TUGAS</th><th>STATUS</th><th>IJAZAH</th><th>Aksi</th></tr></thead><tbody id="adminKaryawanBody"></tbody></table></div><div class="admin-karyawan-pagination" id="adminKaryawanPagination"></div>';
    content.appendChild(panel);

    overlay.innerHTML='<div class="admin-user-modal admin-karyawan-modal"><div class="admin-user-head"><div><div class="eyebrow">KARYAWAN SEKOLAH</div><h3 id="adminKaryawanFormTitle">Tambah Karyawan</h3></div><button class="admin-user-close" type="button" onclick="closeAdminKaryawanForm_()">×</button></div><form id="adminKaryawanForm"><div class="admin-user-grid"><label><span>ID_KARYAWAN</span><input id="adminKaryawanId" required placeholder="Contoh: K001"></label><label><span>NIP</span><input id="adminKaryawanNip" placeholder="NIP / NIPPPK"></label><label class="full"><span>NAMA</span><input id="adminKaryawanName" required></label><label class="full"><span>BIDANG_TUGAS</span><input id="adminKaryawanBidang" required placeholder="Contoh: Tata Usaha"></label><label><span>STATUS</span><select id="adminKaryawanStatus"><option value="ACTIVE">ACTIVE</option><option value="INACTIVE">INACTIVE</option></select></label><label><span>IJAZAH</span><input id="adminKaryawanIjazah" placeholder="Contoh: S1"></label></div><div class="admin-user-foot"><button type="button" class="admin-school-btn secondary" onclick="closeAdminKaryawanForm_()">Batal</button><button id="adminKaryawanSaveBtn" type="submit" class="admin-school-btn primary">Simpan Karyawan</button></div></form></div>';
    document.body.appendChild(overlay);document.getElementById('adminKaryawanForm').onsubmit=submitAdminKaryawanForm_;document.getElementById('adminKaryawanSearch').oninput=filterAdminKaryawan_;
    if(!document.getElementById('adminKaryawanStyle')){const s=document.createElement('style');s.id='adminKaryawanStyle';s.textContent='.admin-karyawan-info{background:#fff;border:1px solid #dfebe5;border-radius:15px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}.admin-karyawan-info strong{display:block;color:#0b3d2e;font-size:16px}.admin-karyawan-info span{display:block;color:#71847b;font-size:12px;margin-top:3px}.admin-karyawan-table th,.admin-karyawan-table td{white-space:nowrap}.admin-karyawan-pagination{display:flex;justify-content:center;align-items:center;gap:12px;padding:14px 4px}.admin-karyawan-pagination span{color:#587067;font-size:13px}.admin-karyawan-pagination button:disabled{opacity:.45}.admin-karyawan-modal{width:min(720px,100%)}@media(max-width:700px){.admin-karyawan-info{align-items:stretch;flex-direction:column}.admin-karyawan-info .admin-kelas-actions{justify-content:flex-start}.admin-karyawan-info .admin-school-btn{flex:1}.admin-karyawan-toolbar .admin-school-actions{width:100%}.admin-karyawan-toolbar input{width:100%!important}.admin-karyawan-table{font-size:12px}}';document.head.appendChild(s);}
    return panel;
  }
  function notice_(m,t){const e=document.getElementById('adminKaryawanNotice');if(!e)return;e.textContent=m||'';e.style.display=m?'block':'none';e.style.background=t==='error'?'#fff0f0':'#edf7f1';e.style.color=t==='error'?'#9b4242':'#28543f';}
  function loadAdminKaryawan(){if(!isAdmin_)return showSessionError({message:'Akses KELOLA KARYAWAN hanya untuk ADMIN_SEKOLAH.'});const panel=ensurePanel_();if(!panel)return;hidePanels_();panel.style.display='block';window.__ACTIVE_ADMIN_PANEL__='KARYAWAN';const school=window.SATRIA_SESSION&&window.SATRIA_SESSION.school||{};const name=document.getElementById('adminKaryawanSchoolName'),meta=document.getElementById('adminKaryawanSchoolMeta');if(name)name.textContent=school.namaSekolah||'Karyawan Sekolah';if(meta)meta.textContent='NPSN: '+(school.npsn||'-')+' • ID: '+(school.idSekolah||'-')+' • Sheet: KARYAWAN';const body=document.getElementById('adminKaryawanBody');if(body)body.innerHTML='<tr><td colspan="7" style="padding:25px;text-align:center">Memuat data KARYAWAN...</td></tr>';google.script.run.withSuccessHandler(function(res){if(!res||!res.ok)return notice_(res&&res.message||'Gagal memuat KARYAWAN.','error');ADMIN_KARYAWAN_STATE.rows=(res.data&&res.data.rows)||[];ADMIN_KARYAWAN_STATE.page=1;render_();}).withFailureHandler(function(err){notice_(err.message,'error');}).getAdminSchoolKaryawan();}
  function refreshAdminKaryawan(){loadAdminKaryawan();}
  function filterAdminKaryawan_(){const q=((document.getElementById('adminKaryawanSearch')||{}).value||'').trim();ADMIN_KARYAWAN_STATE.query=q;ADMIN_KARYAWAN_STATE.page=1;if(q&&q.length<3)notice_('Pencarian baru diproses setelah minimal 3 karakter.','error');else notice_('','success');render_();}
  function filtered_(){const q=(ADMIN_KARYAWAN_STATE.query||'').toLowerCase();if(!q||q.length<3)return ADMIN_KARYAWAN_STATE.rows||[];return(ADMIN_KARYAWAN_STATE.rows||[]).filter(function(r){return[r.ID_KARYAWAN,r.NIP,r.NAMA,r.BIDANG_TUGAS,r.STATUS,r.IJAZAH].join(' ').toLowerCase().indexOf(q)>=0;});}
  function render_(){const rows=filtered_(),total=rows.length,pages=Math.max(1,Math.ceil(total/ADMIN_KARYAWAN_STATE.perPage));ADMIN_KARYAWAN_STATE.page=Math.min(Math.max(1,ADMIN_KARYAWAN_STATE.page),pages);const start=(ADMIN_KARYAWAN_STATE.page-1)*ADMIN_KARYAWAN_STATE.perPage,items=rows.slice(start,start+ADMIN_KARYAWAN_STATE.perPage),count=document.getElementById('adminKaryawanCount'),body=document.getElementById('adminKaryawanBody');if(count)count.textContent=total+' Karyawan'+(ADMIN_KARYAWAN_STATE.query&&ADMIN_KARYAWAN_STATE.query.length>=3?' ditemukan':'');if(body)body.innerHTML=items.map(function(r){const st=String(r.STATUS||'').toUpperCase();return'<tr><td><strong>'+escapeHtml(r.ID_KARYAWAN)+'</strong></td><td>'+escapeHtml(r.NIP||'—')+'</td><td>'+escapeHtml(r.NAMA)+'</td><td>'+escapeHtml(r.BIDANG_TUGAS)+'</td><td class="admin-user-status '+(st==='ACTIVE'?'active':'inactive')+'">'+escapeHtml(st)+'</td><td>'+escapeHtml(r.IJAZAH||'—')+'</td><td><button class="admin-row-btn" onclick="openAdminKaryawanForm_('+Number(r._row)+')">Edit</button><button class="admin-row-btn danger" onclick="deleteAdminKaryawan_('+Number(r._row)+')">Hapus</button></td></tr>';}).join('')||'<tr><td colspan="7" style="padding:25px;text-align:center;color:#71847b">Belum ada data KARYAWAN.</td></tr>';const box=document.getElementById('adminKaryawanPagination');if(box)box.innerHTML='<button class="admin-school-btn secondary" '+(ADMIN_KARYAWAN_STATE.page<=1?'disabled':'')+' onclick="changeAdminKaryawanPage_('+(ADMIN_KARYAWAN_STATE.page-1)+')">‹ Prev</button><span>Halaman <strong>'+ADMIN_KARYAWAN_STATE.page+'</strong> / '+pages+' • '+total+' data</span><button class="admin-school-btn secondary" '+(ADMIN_KARYAWAN_STATE.page>=pages?'disabled':'')+' onclick="changeAdminKaryawanPage_('+(ADMIN_KARYAWAN_STATE.page+1)+')">Next ›</button>';}
  function changeAdminKaryawanPage_(p){ADMIN_KARYAWAN_STATE.page=p;render_();}
  function openAdminKaryawanForm_(rowNumber){ADMIN_KARYAWAN_STATE.editingRow=rowNumber||null;const row=rowNumber?(ADMIN_KARYAWAN_STATE.rows||[]).find(function(x){return Number(x._row)===Number(rowNumber);}):{};document.getElementById('adminKaryawanFormTitle').textContent=rowNumber?'Edit Karyawan':'Tambah Karyawan';document.getElementById('adminKaryawanId').value=row.ID_KARYAWAN||'';document.getElementById('adminKaryawanNip').value=row.NIP||'';document.getElementById('adminKaryawanName').value=row.NAMA||'';document.getElementById('adminKaryawanBidang').value=row.BIDANG_TUGAS||'';document.getElementById('adminKaryawanStatus').value=row.STATUS||'ACTIVE';document.getElementById('adminKaryawanIjazah').value=row.IJAZAH||'';document.getElementById('adminKaryawanOverlay').style.display='flex';}
  function closeAdminKaryawanForm_(){const o=document.getElementById('adminKaryawanOverlay');if(o)o.style.display='none';ADMIN_KARYAWAN_STATE.editingRow=null;}
  function submitAdminKaryawanForm_(e){e.preventDefault();const btn=document.getElementById('adminKaryawanSaveBtn');btn.disabled=true;btn.textContent='Menyimpan...';const payload={_row:ADMIN_KARYAWAN_STATE.editingRow||0,ID_KARYAWAN:document.getElementById('adminKaryawanId').value.trim(),NIP:document.getElementById('adminKaryawanNip').value.trim(),NAMA:document.getElementById('adminKaryawanName').value.trim(),BIDANG_TUGAS:document.getElementById('adminKaryawanBidang').value.trim(),STATUS:document.getElementById('adminKaryawanStatus').value,IJAZAH:document.getElementById('adminKaryawanIjazah').value.trim()};google.script.run.withSuccessHandler(function(res){btn.disabled=false;btn.textContent='Simpan Karyawan';if(!res||!res.ok)return notice_(res&&res.message||'Gagal menyimpan KARYAWAN.','error');ADMIN_KARYAWAN_STATE.rows=(res.data&&res.data.rows)||[];closeAdminKaryawanForm_();render_();notice_('Data KARYAWAN berhasil disimpan.','success');}).withFailureHandler(function(err){btn.disabled=false;btn.textContent='Simpan Karyawan';notice_(err.message,'error');}).saveAdminSchoolKaryawan(payload);}
  function deleteAdminKaryawan_(rowNumber){if(!confirm('Hapus data KARYAWAN ini?'))return;google.script.run.withSuccessHandler(function(res){if(!res||!res.ok)return notice_(res&&res.message||'Gagal menghapus KARYAWAN.','error');ADMIN_KARYAWAN_STATE.rows=(res.data&&res.data.rows)||[];render_();notice_('Data KARYAWAN berhasil dihapus.','success');}).withFailureHandler(function(err){notice_(err.message,'error');}).deleteAdminSchoolKaryawan(rowNumber);}
  function downloadKaryawanTemplate_(){const h=['ID_KARYAWAN','NIP','NAMA','BIDANG_TUGAS','STATUS','IJAZAH'],csv='\ufeff'+h.join(',')+'\r\n',blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TEMPLATE_KARYAWAN.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);notice_('Template KARYAWAN berhasil diunduh.','success');}
  function parseCsv_(text){const rows=[],row=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quoted&&n==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(function(v){return String(v).trim()!=='';}))rows.push(row.splice(0,row.length));}else cell+=c;}row.push(cell);if(row.some(function(v){return String(v).trim()!=='';}))rows.push(row);return rows;}
  function uploadAdminKaryawanTemplate_(event){const file=event.target.files&&event.target.files[0];if(!file)return;event.target.value='';if(file.size>2*1024*1024)return notice_('Ukuran template maksimal 2 MB.','error');const reader=new FileReader();reader.onload=function(e){try{const m=parseCsv_(e.target.result||'');if(m.length<2)throw new Error('Template tidak memiliki data.');const h=m[0].map(function(v){return String(v).replace(/^\ufeff/,'').trim().toUpperCase();}),expected=['ID_KARYAWAN','NIP','NAMA','BIDANG_TUGAS','STATUS','IJAZAH'];if(h.join('|')!==expected.join('|'))throw new Error('Header template harus persis: '+expected.join(', '));const rows=m.slice(1).filter(function(r){return r.some(function(v){return String(v).trim()!=='';});}).map(function(r){return{ID_KARYAWAN:String(r[0]||'').trim(),NIP:String(r[1]||'').trim(),NAMA:String(r[2]||'').trim(),BIDANG_TUGAS:String(r[3]||'').trim(),STATUS:String(r[4]||'ACTIVE').trim().toUpperCase(),IJAZAH:String(r[5]||'').trim()};});if(!rows.length)throw new Error('Tidak ada baris data KARYAWAN.');notice_('Mengunggah '+rows.length+' data KARYAWAN...','success');google.script.run.withSuccessHandler(function(res){if(!res||!res.ok)return notice_(res&&res.message||'Upload template gagal.','error');ADMIN_KARYAWAN_STATE.rows=(res.data&&res.data.rows)||[];ADMIN_KARYAWAN_STATE.page=1;render_();notice_('Upload selesai. Masuk: '+res.data.inserted+', dilewati: '+res.data.skipped+(res.data.errors&&res.data.errors.length?' • error: '+res.data.errors.length:'')+'.','success');}).withFailureHandler(function(err){notice_(err.message,'error');}).importAdminSchoolKaryawan(rows);}catch(err){notice_(err.message||String(err),'error');}};reader.readAsText(file,'UTF-8');}
  const baseInit=window.initAdminSekolahNav_;window.initAdminSekolahNav_=function(){if(typeof baseInit==='function')baseInit();if(!isAdmin_())return;const section=document.getElementById('schoolAdminSection');if(!section)return;if(!document.getElementById('schoolKaryawanNav')){const b=document.createElement('button');b.id='schoolKaryawanNav';b.className='nav-item';b.dataset.menu='ADMIN_KARYAWAN';b.innerHTML='🧑‍💼 <span>Kelola Karyawan</span>';b.onclick=function(){window.selectMenu('ADMIN_KARYAWAN');};section.appendChild(b);}};
  const baseSelect=window.selectMenu;window.selectMenu=function(menuCode){const code=String(menuCode||'').toUpperCase();if(code==='ADMIN_KARYAWAN'){if(!isAdmin_())return showSessionError({message:'Akses KELOLA KARYAWAN hanya untuk ADMIN_SEKOLAH.'});document.querySelectorAll('.nav-item').forEach(function(el){el.classList.toggle('active',String(el.dataset.menu||'').toUpperCase()===code);});return loadAdminKaryawan();}return baseSelect(menuCode);};
  window.loadAdminKaryawan=loadAdminKaryawan;window.refreshAdminKaryawan=refreshAdminKaryawan;window.openAdminKaryawanForm_=openAdminKaryawanForm_;window.closeAdminKaryawanForm_=closeAdminKaryawanForm_;window.submitAdminKaryawanForm_=submitAdminKaryawanForm_;window.deleteAdminKaryawan_=deleteAdminKaryawan_;window.downloadKaryawanTemplate_=downloadKaryawanTemplate_;window.uploadAdminKaryawanTemplate_=uploadAdminKaryawanTemplate_;window.changeAdminKaryawanPage_=changeAdminKaryawanPage_;
})();
</script>
