<script>
function showPDFGatewayButtonWhenReady_() {
  const btn = document.getElementById('testPDFGatewayBtn');
  if (!btn) return;
  const session = window.SATRIA_SESSION;
  const user = session && session.user ? session.user : null;
  const school = session && session.school ? session.school : null;
  if (!user || !school) return;
  const email = String(user.email || '').toLowerCase();
  const role = String(user.role || '').toUpperCase();
  const schoolId = String(school.idSekolah || school.id_sekolah || '').toUpperCase();
  btn.style.display = email === 'kurikulum.sman3pwr@gmail.com' && role === 'GURU' && schoolId === 'SMANTI03PWJ' ? 'block' : 'none';
}

function testGatewayPDF() {
  const btn = document.getElementById('testPDFGatewayBtn');
  const result = document.getElementById('gatewayTestResult');
  if (!btn || !result) return;
  const span = btn.querySelector('span');
  btn.disabled = true;
  btn.style.opacity = '0.65';
  if (span) span.textContent = 'Menguji PDF Gateway...';
  result.style.display = 'block';
  result.innerHTML = '<div class="card-body"><h5>TEST PDF GATEWAY</h5><p>Membuat PDF melalui Write Gateway sebagai Guru Sekolah 2...</p></div>';

  const timeoutId = setTimeout(function() {
    btn.disabled = false; btn.style.opacity = '1';
    if (span) span.textContent = 'TEST PDF GATEWAY';
    result.innerHTML = '<div class="card-body"><h5>TEST PDF GATEWAY — TIMEOUT</h5><p>❌ Server belum mengembalikan respons. Pastikan fungsi testGatewayPDFAsCurrentUser sudah dipull dan Web App sudah dideploy ulang.</p></div>';
  }, 30000);

  google.script.run
    .withSuccessHandler(function(response) {
      clearTimeout(timeoutId);
      btn.disabled = false; btn.style.opacity = '1';
      if (span) span.textContent = 'TEST PDF GATEWAY';
      if (!response || response.ok !== true) {
        result.innerHTML = '<div class="card-body"><h5>TEST PDF GATEWAY — GAGAL</h5><p>❌ Gateway PDF menolak pengujian.</p><pre>' + escapeHtml(JSON.stringify(response || {}, null, 2)) + '</pre></div>';
        return;
      }
      result.innerHTML = '<div class="card-body"><h5>TEST PDF GATEWAY — PASS</h5>' +
        '<p><b>User:</b> ' + escapeHtml(response.user) + '</p>' +
        '<p><b>Role:</b> ' + escapeHtml(response.role) + '</p>' +
        '<p><b>Sekolah:</b> ' + escapeHtml(response.schoolId) + '</p>' +
        '<p><b>Gateway:</b> ' + escapeHtml(response.gateway) + ' ✓</p>' +
        '<p><b>PDF Create:</b> ' + escapeHtml(response.pdfCreate) + ' ✓</p>' +
        '<p><b>File:</b> ' + escapeHtml(response.fileName || '-') + '</p>' +
        '<p><b>File ID:</b> ' + escapeHtml(response.fileId || '-') + '</p>' +
        (response.fileUrl ? '<p><b>URL:</b> <a href="' + escapeHtml(response.fileUrl) + '" target="_blank" rel="noopener">Buka PDF</a></p>' : '') +
        '<p>' + escapeHtml(response.message || 'PDF Gateway berhasil.') + '</p></div>';
    })
    .withFailureHandler(function(error) {
      clearTimeout(timeoutId);
      btn.disabled = false; btn.style.opacity = '1';
      if (span) span.textContent = 'TEST PDF GATEWAY';
      const message = error && error.message ? error.message : String(error || 'Pengujian gagal.');
      result.innerHTML = '<div class="card-body"><h5>TEST PDF GATEWAY — GAGAL</h5><p>❌ ' + escapeHtml(message) + '</p></div>';
    })
    .testGatewayPDFAsCurrentUser();
}

(function waitForPDFGatewaySession_() {
  let tries = 0;
  const timer = setInterval(function() {
    tries++;
    showPDFGatewayButtonWhenReady_();
    if (window.SATRIA_SESSION || tries > 60) clearInterval(timer);
  }, 250);
  window.addEventListener('load', showPDFGatewayButtonWhenReady_);
})();
</script>
