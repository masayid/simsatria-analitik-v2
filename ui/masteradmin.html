<section id="masterAdminPanel" class="master-admin-panel" style="display:none;">
  <div class="master-admin-head">
    <div>
      <div class="eyebrow">OWNER • MASTER CONTROL</div>
      <h2>Pengaturan MASTER</h2>
      <p>Kelola data pusat SIM SATRIA. Perubahan langsung tersimpan ke Spreadsheet MASTER.</p>
    </div>
    <div class="master-owner-badge" id="masterOwnerBadge">OWNER</div>
  </div>

  <div class="master-tabs" id="masterTabs"></div>

  <div class="master-toolbar">
    <div class="master-title-wrap">
      <strong id="masterCurrentTitle">MASTER_SEKOLAH</strong>
      <span id="masterRowCount">0 data</span>
    </div>
    <div class="master-actions">
      <input id="masterSearch" class="master-search" type="search" placeholder="Cari data..." oninput="filterMasterRows()">
      <button class="master-btn secondary" onclick="refreshMasterCurrent()">↻ Refresh</button>
      <button class="master-btn primary" onclick="openMasterForm()">＋ Tambah</button>
    </div>
  </div>

  <div class="master-table-wrap">
    <table class="master-table">
      <thead id="masterTableHead"></thead>
      <tbody id="masterTableBody"></tbody>
    </table>
  </div>
</section>

<div id="masterFormOverlay" class="master-overlay" style="display:none;">
  <div class="master-modal">
    <div class="master-modal-head">
      <div>
        <div class="eyebrow">MASTER DATA</div>
        <h3 id="masterFormTitle">Tambah Data</h3>
      </div>
      <button class="master-close" onclick="closeMasterForm()">×</button>
    </div>
    <form id="masterForm" onsubmit="submitMasterForm(event)">
      <div id="masterFormFields" class="master-form-grid"></div>
      <div class="master-modal-foot">
        <button type="button" class="master-btn secondary" onclick="closeMasterForm()">Batal</button>
        <button type="submit" class="master-btn primary" id="masterSaveBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<style>
.master-admin-panel{background:#f5fbf7;border-radius:24px;padding:24px;min-height:calc(100vh - 80px)}
.master-admin-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;background:linear-gradient(135deg,#0b3d2e,#2e7d32);color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:16px}
.master-admin-head h2{margin:4px 0 6px;font-size:25px}.master-admin-head p{margin:0;opacity:.82}.master-owner-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);padding:8px 13px;border-radius:999px;font-size:12px;font-weight:700}
.master-tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 13px}.master-tab{border:1px solid #d9e7df;background:#fff;border-radius:10px;padding:9px 13px;white-space:nowrap;cursor:pointer;font-weight:600;color:#355247}.master-tab.active{background:#0b3d2e;color:#fff;border-color:#0b3d2e}
.master-toolbar{background:#fff;border:1px solid #e1ece6;border-radius:16px;padding:13px 15px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.master-title-wrap{display:flex;gap:10px;align-items:center}.master-title-wrap span{font-size:12px;color:#71847b}.master-actions{display:flex;gap:7px;align-items:center}.master-search{width:220px;border:1px solid #d5e2dc;border-radius:9px;padding:9px 11px}.master-btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.master-btn.primary{background:#0b3d2e;color:#fff}.master-btn.secondary{background:#edf4f0;color:#244b3d}
.master-table-wrap{background:#fff;border:1px solid #e1ece6;border-radius:16px;overflow:auto}.master-table{width:100%;border-collapse:collapse;font-size:13px}.master-table th{background:#f0f7f3;color:#355247;text-align:left;padding:11px;border-bottom:1px solid #dfeae4;white-space:nowrap}.master-table td{padding:10px 11px;border-bottom:1px solid #edf2ef;vertical-align:top}.master-table tr:hover td{background:#fbfdfc}.master-cell{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.master-row-actions{white-space:nowrap}.master-mini{border:0;background:#eef5f1;border-radius:7px;padding:6px 8px;cursor:pointer;margin-right:4px}.master-mini.danger{background:#fff0f0;color:#a33}
.master-overlay{position:fixed;inset:0;background:rgba(7,31,23,.48);z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px}.master-modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.master-modal-head{display:flex;justify-content:space-between;padding:20px 22px;border-bottom:1px solid #e7eee9}.master-modal-head h3{margin:3px 0 0}.master-close{border:0;background:#f0f4f2;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}.master-form-grid{padding:20px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.master-field{display:flex;flex-direction:column;gap:6px}.master-field.full{grid-column:1/-1}.master-field label{font-size:12px;font-weight:700;color:#4c6259}.master-field input,.master-field select{width:100%;box-sizing:border-box;border:1px solid #d6e3dd;border-radius:9px;padding:10px;background:#fff}.master-modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:15px 22px;border-top:1px solid #e7eee9}@media(max-width:700px){.master-admin-panel{padding:12px}.master-toolbar{align-items:stretch;flex-direction:column}.master-actions{flex-wrap:wrap}.master-search{width:100%;flex:1}.master-form-grid{grid-template-columns:1fr}.master-field.full{grid-column:auto}.master-admin-head{padding:17px}.master-admin-head h2{font-size:21px}}
</style>

<script>
let MASTER_ADMIN = { sheets: [], current: null, data: null, editingRow: null };

function initMasterAdmin() {
  google.script.run.withSuccessHandler(function(res) {
    if (!res || !res.ok || !res.data || !res.data.isOwner) return;
    MASTER_ADMIN.sheets = res.data.sheets || [];
    const nav = document.getElementById('masterAdminNav');
    const ownerSection = document.getElementById('masterOwnerSection');
    if (ownerSection) ownerSection.style.display = '';
    if (nav) nav.style.display = '';
  }).withFailureHandler(function() {}).getMasterAdminContext();
}

function loadMasterAdmin() {
  const panel = document.getElementById('masterAdminPanel');
  if (!panel) return;
  panel.style.display = 'block';
  document.querySelectorAll('#content > *:not(#masterAdminPanel)').forEach(function(el){el.style.display='none';});
  if (!MASTER_ADMIN.sheets.length) {
    google.script.run.withSuccessHandler(function(res){
      if (!res || !res.ok) return showMasterError(res && res.message);
      MASTER_ADMIN.sheets = res.data.sheets || [];
      renderMasterTabs();
      if (MASTER_ADMIN.sheets[0]) loadMasterSheet(MASTER_ADMIN.sheets[0].name);
    }).withFailureHandler(function(err){showMasterError(err.message);}).getMasterAdminContext();
    return;
  }
  renderMasterTabs();
  loadMasterSheet(MASTER_ADMIN.current || MASTER_ADMIN.sheets[0].name);
}

function renderMasterTabs() {
  const box=document.getElementById('masterTabs'); if(!box)return;
  box.innerHTML=MASTER_ADMIN.sheets.map(function(s){
    return '<button class="master-tab '+(MASTER_ADMIN.current===s.name?'active':'')+'" onclick="loadMasterSheet(\''+escapeJs_(s.name)+'\')">'+escapeHtml(s.name)+'</button>';
  }).join('');
}

function loadMasterSheet(sheetName) {
  MASTER_ADMIN.current=sheetName; MASTER_ADMIN.editingRow=null;
  renderMasterTabs();
  const body=document.getElementById('masterTableBody');
  if(body) body.innerHTML='<tr><td colspan="20" style="padding:25px;text-align:center">Memuat data...</td></tr>';
  google.script.run.withSuccessHandler(function(res){
    if(!res || !res.ok){showMasterError(res&&res.message);return;}
    MASTER_ADMIN.data=res.data;
    renderMasterTable();
  }).withFailureHandler(function(err){showMasterError(err.message);}).getMasterSheetData(sheetName);
}

function refreshMasterCurrent(){if(MASTER_ADMIN.current)loadMasterSheet(MASTER_ADMIN.current);}

function renderMasterTable(){
  const d=MASTER_ADMIN.data||{headers:[],rows:[]};
  const title=document.getElementById('masterCurrentTitle'); const count=document.getElementById('masterRowCount');
  if(title)title.textContent=d.sheet||MASTER_ADMIN.current||'';
  if(count)count.textContent=(d.rows||[]).length+' data';
  const head=document.getElementById('masterTableHead'); const body=document.getElementById('masterTableBody');
  if(!head||!body)return;
  head.innerHTML='<tr>'+d.headers.map(function(h){return '<th>'+escapeHtml(h)+'</th>';}).join('')+'<th>Aksi</th></tr>';
  body.innerHTML=(d.rows||[]).map(function(row){
    const cells=d.headers.map(function(h){return '<td><div class="master-cell" title="'+escapeHtml(formatMasterValue(row[h]))+'">'+escapeHtml(formatMasterValue(row[h]))+'</div></td>';}).join('');
    return '<tr data-master-search="'+escapeHtml(d.headers.map(function(h){return formatMasterValue(row[h]);}).join(' '))+'">'+cells+'<td class="master-row-actions"><button class="master-mini" onclick="openMasterForm('+Number(row._row)+')">Edit</button><button class="master-mini danger" onclick="deleteMasterRow('+Number(row._row)+')">Hapus</button></td></tr>';
  }).join('') || '<tr><td colspan="20" style="padding:25px;text-align:center;color:#71847b">Belum ada data.</td></tr>';
}

function formatMasterValue(v){if(v instanceof Date)return v.toLocaleString('id-ID');return v==null?'':String(v);}
function filterMasterRows(){const q=(document.getElementById('masterSearch')||{}).value?.toLowerCase()||'';document.querySelectorAll('#masterTableBody tr[data-master-search]').forEach(function(tr){tr.style.display=tr.dataset.masterSearch.toLowerCase().indexOf(q)>=0?'':'none';});}

function openMasterForm(rowNumber){
  MASTER_ADMIN.editingRow=rowNumber||null;
  const d=MASTER_ADMIN.data; if(!d)return;
  const row=rowNumber?(d.rows||[]).find(function(r){return Number(r._row)===Number(rowNumber);}):{};
  document.getElementById('masterFormTitle').textContent=(rowNumber?'Edit ':'Tambah ')+(d.sheet||'MASTER');
  const box=document.getElementById('masterFormFields');
  box.innerHTML=d.headers.map(function(h){
    const val=formatMasterValue(row[h]);
    const type=/^(aktif|status)$/i.test(h)?'select':'input';
    let field;
    if(type==='select') field='<select id="mf_'+escapeAttr_(h)+'"><option value="ACTIVE" '+(String(val).toUpperCase()==='ACTIVE'?'selected':'')+'>ACTIVE</option><option value="INACTIVE" '+(String(val).toUpperCase()==='INACTIVE'?'selected':'')+'>INACTIVE</option></select>';
    else field='<input id="mf_'+escapeAttr_(h)+'" value="'+escapeHtml(val)+'" autocomplete="off">';
    return '<div class="master-field '+(h==='deskripsi'||h==='keterangan'?'full':'')+'"><label>'+escapeHtml(h)+'</label>'+field+'</div>';
  }).join('');
  document.getElementById('masterFormOverlay').style.display='flex';
}

function closeMasterForm(){document.getElementById('masterFormOverlay').style.display='none';}
function submitMasterForm(e){
  e.preventDefault(); const d=MASTER_ADMIN.data; const row={_row:MASTER_ADMIN.editingRow||0};
  d.headers.forEach(function(h){const el=document.getElementById('mf_'+escapeAttr_(h));row[h]=el?el.value:'';});
  const btn=document.getElementById('masterSaveBtn');btn.disabled=true;btn.textContent='Menyimpan...';
  google.script.run.withSuccessHandler(function(res){btn.disabled=false;btn.textContent='Simpan';if(!res||!res.ok){showMasterError(res&&res.message);return;}MASTER_ADMIN.data=res.data;closeMasterForm();renderMasterTable();}).withFailureHandler(function(err){btn.disabled=false;btn.textContent='Simpan';showMasterError(err.message);}).saveMasterSheetRow(d.sheet,row);
}

function deleteMasterRow(rowNumber){
  if(!confirm('Hapus data pada '+MASTER_ADMIN.current+'? Tindakan ini tidak dapat dibatalkan.'))return;
  google.script.run.withSuccessHandler(function(res){if(!res||!res.ok){showMasterError(res&&res.message);return;}MASTER_ADMIN.data=res.data;renderMasterTable();}).withFailureHandler(function(err){showMasterError(err.message);}).deleteMasterSheetRow(MASTER_ADMIN.current,rowNumber);
}
function showMasterError(msg){alert(msg||'Terjadi kesalahan pada MASTER.');}
function escapeJs_(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function escapeAttr_(v){return String(v).replace(/[^a-zA-Z0-9_-]/g,'_');}
</script>
