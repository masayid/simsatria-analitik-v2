  <script>
    try {
      Object.defineProperty(window, 'SATRIA_SESSION', {
        configurable: true,
        enumerable: false,
        get: function(){ return SATRIA_SESSION; },
        set: function(value){ SATRIA_SESSION = value; }
      });
    } catch (e) {
      window.SATRIA_SESSION = (typeof SATRIA_SESSION !== 'undefined') ? SATRIA_SESSION : null;
    }

    /*
     * Dashboard guard.
     * Semua isi dashboard berada di #dashboardHome sehingga satu aturan
     * dapat memastikan dashboard tidak ikut tampil pada menu lain.
     */
    (function installDashboardOnlyGuard_(){
      function setDashboardVisible_(visible){
        var dashboard=document.getElementById('dashboardHome');
        if(dashboard)dashboard.style.display=visible?'':'none';
      }

      var originalSelectMenu=window.selectMenu;
      if(typeof originalSelectMenu==='function'){
        window.selectMenu=function(menuCode){
          var code=String(menuCode||'').toUpperCase();
          setDashboardVisible_(code==='DASHBOARD');
          return originalSelectMenu.apply(this,arguments);
        };
      }

      var originalLoadDashboard=window.loadDashboard;
      if(typeof originalLoadDashboard==='function'){
        window.loadDashboard=function(){
          setDashboardVisible_(true);
          return originalLoadDashboard.apply(this,arguments);
        };
      }

      /* Default saat aplikasi pertama dibuka = Dashboard. */
      setDashboardVisible_(true);
    })();

    (function bindAdminSiswaPageGuard_(){
      var originalLoad = window.loadAdminSiswa;
      if (typeof originalLoad !== 'function') return;
      window.loadAdminSiswa = function(){
        var dashboard = document.getElementById('dashboardHome');
        var welcome = document.getElementById('welcome');
        var permission = document.getElementById('permissionSection');
        var master = document.getElementById('masterAdminPanel');
        if (dashboard) dashboard.style.display = 'none';
        if (welcome) welcome.style.display = 'none';
        if (permission) permission.style.display = 'none';
        if (master) master.style.display = 'none';
        return originalLoad.apply(this, arguments);
      };
    })();
  </script>
