  <script>
    try {
      Object.defineProperty(window, 'SATRIA_SESSION', {
        configurable: true,
        enumerable: false,
        get: function(){ return SATRIA_SESSION; },
        set: function(value){ SATRIA_SESSION = value; }
      });
    } catch (e) {
      window.SATRIA_SESSION = (typeof SATRIA_SESSION !== 'undefined') ? SATRIA_SESSION : null;
    }

    (function bindAdminSiswaPageGuard_(){
      var originalLoad = window.loadAdminSiswa;
      if (typeof originalLoad !== 'function') return;
      window.loadAdminSiswa = function(){
        var welcome = document.getElementById('welcome');
        var permission = document.getElementById('permissionSection');
        var master = document.getElementById('masterAdminPanel');
        if (welcome) welcome.style.display = 'none';
        if (permission) permission.style.display = 'none';
        if (master) master.style.display = 'none';
        return originalLoad.apply(this, arguments);
      };
    })();
  </script>
